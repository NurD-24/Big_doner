<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181b">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Big Doner">
<title>Big Doner Aktau — донер, чикен, пицца Ақтауда</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#16181b;--bg2:#1f2226;--tx:#f4f1ea;--mut:#a9adb3;--ac:#f6a82c;--ac2:#d8362b;--ln:#33373d;--on:#16181b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fbf7ef;--bg2:#fff;--tx:#1d1f22;--mut:#5d636b;--ln:#e4dccb;--on:#16181b}}
:root[data-theme="dark"]{--bg:#16181b;--bg2:#1f2226;--tx:#f4f1ea;--mut:#a9adb3;--ln:#33373d}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:Rubik,system-ui,sans-serif;line-height:1.55}
.w{max-width:960px;margin:0 auto;padding:0 20px}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
.logo{font-weight:800;font-size:22px;color:var(--ac);letter-spacing:.5px}
.logo b{color:var(--ac2)}
.btn{display:inline-block;background:var(--ac);color:var(--on);font-weight:700;padding:13px 22px;border-radius:10px;text-decoration:none;border:0;font:inherit;font-weight:700;cursor:pointer}
.btn.o{background:none;color:var(--tx);border:2px solid var(--ln)}
.btn:focus-visible,.tab:focus-visible,a:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
.hero{padding:44px 0 56px}
.hero h1{font-size:clamp(40px,9vw,84px);line-height:1.02;font-weight:800;max-width:11em}
.hero h1 span{color:var(--ac)}
.hero p{margin:20px 0 28px;max-width:34em;color:var(--mut);font-size:18px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--ln);border:1px solid var(--ln);border-radius:14px;overflow:hidden;margin-bottom:64px}
.facts div{background:var(--bg2);padding:18px 20px}
.facts strong{display:block;font-size:18px}
.facts small{color:var(--mut)}
h2{font-size:clamp(28px,5vw,40px);margin-bottom:20px;font-weight:800}
section{margin-bottom:64px}
.combos{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.combo{background:var(--bg2);border:1px solid var(--ln);border-radius:16px;padding:24px;border-top:6px solid var(--ac)}
.combo.big{border-top-color:var(--ac2)}
.combo h3{font-size:22px}
.combo ul{list-style:none;padding:0;margin:14px 0}
.combo li{padding:6px 0;border-bottom:1px dashed var(--ln)}
.price{font-size:34px;font-weight:800;color:var(--ac)}
.tag{display:inline-block;font-size:13px;background:var(--ac2);color:#fff;padding:3px 10px;border-radius:99px;margin-bottom:10px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:12px}
.tab{flex:none;background:var(--bg2);color:var(--tx);border:1px solid var(--ln);padding:10px 18px;border-radius:99px;font:inherit;cursor:pointer}
.tab[aria-selected=true]{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:700}
.panel{display:none;background:var(--bg2);border:1px solid var(--ln);border-radius:16px;padding:8px 22px}
.panel.on{display:block}
.panel h3{padding:16px 0 4px;color:var(--ac);font-size:18px}
.it{display:flex;gap:10px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--ln)}
.it:last-child{border:0}
.it i{flex:1;border-bottom:2px dotted var(--ln);transform:translateY(-4px)}
.it b{white-space:nowrap}
.note{color:var(--mut);padding:10px 0 16px;font-size:15px}
.reviews{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
blockquote{background:var(--bg2);border-left:5px solid var(--ac);border-radius:10px;padding:18px 20px}
blockquote small{display:block;margin-top:8px;color:var(--mut)}
.contacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.branch{background:var(--bg2);border:1px solid var(--ln);border-radius:16px;padding:24px}
.branch h3{margin-bottom:6px}
.branch a.tel{display:block;font-size:26px;font-weight:800;color:var(--ac);text-decoration:none;margin:8px 0 14px}
.cta{background:var(--ac);color:var(--on);border-radius:20px;padding:36px 28px;margin-bottom:56px}
.cta h2{margin-bottom:8px}
.cta .btn{background:var(--on);color:var(--ac)}
.cta .btn.o{background:none;color:var(--on);border-color:var(--on)}
footer{border-top:1px solid var(--ln);padding:22px 0 40px;color:var(--mut);font-size:14px}

.it{align-items:center}
.it .nm{flex:none}
.plus{flex:none;width:36px;height:36px;border-radius:10px;border:0;background:var(--ac);color:var(--on);font:inherit;font-size:22px;font-weight:800;cursor:pointer;position:relative}
.plus em{position:absolute;top:-7px;right:-7px;background:var(--ac2);color:#fff;font-style:normal;font-size:12px;min-width:20px;height:20px;border-radius:99px;display:none;align-items:center;justify-content:center;padding:0 4px}
.plus em.on{display:flex}
.plus:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
#bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:none;z-index:20}
#bar.on{display:block}
#bar button{width:100%;max-width:960px;margin:0 auto;display:flex;justify-content:space-between;background:var(--ac2);color:#fff;border:0;border-radius:14px;padding:15px 20px;font:inherit;font-weight:700;font-size:17px;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.35)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:30}
#ov.on{display:block}
#cart{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));max-width:620px;margin:0 auto}
#cart h2{font-size:26px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
#cart h2 button{background:none;border:0;color:var(--tx);font-size:30px;cursor:pointer}
.ci{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--ln)}
.ci .q{display:flex;align-items:center;gap:10px}
.ci .q button{width:32px;height:32px;border-radius:8px;border:1px solid var(--ln);background:var(--bg2);color:var(--tx);font:inherit;font-size:18px;cursor:pointer}
.ci b{text-align:right}
.tot{display:flex;justify-content:space-between;font-size:22px;font-weight:800;padding:16px 0 4px}
.tot span:last-child{color:var(--ac)}
#cart label{display:block;margin:12px 0 4px;font-size:14px;color:var(--mut)}
#cart select,#cart input,#cart textarea{width:100%;background:var(--bg2);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:11px 12px;font:inherit}
#cart .btn{width:100%;text-align:center;margin-top:16px;background:#25a244;color:#fff}
#cart .btn.dis{opacity:.45;pointer-events:none}
#dn{font-size:14px;color:var(--mut);margin-top:4px}
body{padding-bottom:84px}

.combos{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px;scrollbar-width:thin}
.combos .cb{flex:0 0 min(330px,86vw);scroll-snap-align:start}
.chead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.arr{width:44px;height:44px;border-radius:50%;border:1px solid var(--ln);background:var(--bg2);color:var(--tx);font-size:24px;cursor:pointer}
.arr:hover{background:var(--ac);color:var(--on)}
.arr:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
.cb{display:flex;gap:14px;background:var(--bg2);border:1px solid var(--ln);border-radius:16px;padding:14px;border-top:5px solid var(--ac)}
.cb img{width:110px;height:auto;align-self:flex-start;border-radius:10px;cursor:zoom-in;flex:none}
.cb h3{font-size:20px}
.cb ul{list-style:none;padding:0;margin:8px 0;font-size:15px;color:var(--mut)}
.cb .price{font-size:26px}
.cb .btn{padding:10px 16px;margin-top:8px;font-size:15px}
.cb.fr .tag{margin:0 0 6px}
.shots{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x mandatory}
.shots img{height:420px;width:auto;border-radius:14px;border:1px solid var(--ln);scroll-snap-align:start;cursor:zoom-in;flex:none}
#zm{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:40;padding:16px;cursor:zoom-out}
#zm.on{display:flex}
#zm img{max-width:100%;max-height:100%;border-radius:12px}
#send{border:0;font:inherit;font-weight:700;cursor:pointer}#st{margin-top:12px;font-size:15px}#st .ok{color:#25a244;font-weight:700}.sx{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--ac);color:var(--on);font-weight:700;font-size:13px}
.logo{display:flex;align-items:center;gap:10px}.lg{width:46px;height:46px;border-radius:50%;transition:transform .6s cubic-bezier(.3,1.6,.5,1)}.logo:hover .lg{transform:rotate(360deg) scale(1.1)}
.hr{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.hero{position:relative;isolation:isolate;display:grid;grid-template-columns:1fr auto;gap:32px;align-items:center}
.hero::before{content:"";position:absolute;inset:-40px 0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse 30% 50% at 70% 45%,rgba(246,168,44,.30),transparent),radial-gradient(ellipse 26% 40% at 25% 82%,rgba(216,54,43,.14),transparent);animation:glow 9s ease-in-out infinite alternate}
.hl{width:clamp(150px,26vw,300px);height:auto;border-radius:50%;filter:drop-shadow(0 18px 40px rgba(246,168,44,.35));animation:float 5s ease-in-out infinite,pop .9s cubic-bezier(.2,1.4,.4,1) both}
.hc>*{animation:fadeUp .8s cubic-bezier(.2,.7,.2,1) both}.hc>:nth-child(2){animation-delay:.12s}.hc>:nth-child(3){animation-delay:.24s}
h1 span{background:linear-gradient(90deg,var(--ac),var(--ac2),var(--ac));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
.pulse{animation:ring 2.2s infinite}
.btn{transition:transform .2s,box-shadow .2s,filter .2s}.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}.btn:active{transform:scale(.96)}
.rv{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1),box-shadow .3s}.rv.in{opacity:1;transform:none}
.cb.rv.in:hover{transform:translateY(-6px);box-shadow:0 14px 34px rgba(0,0,0,.35)}.cb img{transition:transform .4s}.cb:hover img{transform:scale(1.07) rotate(-1.5deg)}
.panel.on{animation:fadeUp .4s both}.panel.on .it{animation:fadeUp .45s both}.it{transition:background .2s,padding-left .2s}.it:hover{padding-left:8px}
.plus{transition:transform .15s}.plus:hover{transform:scale(1.15)}.pop{animation:pop .35s}
.tab{transition:background .2s,color .2s,transform .2s}.tab:hover{transform:translateY(-2px)}
#open.bump{animation:bump .45s}#ov.on #cart{animation:slideUp .35s cubic-bezier(.2,.8,.2,1)}
.branch{transition:transform .25s,border-color .25s}.branch:hover{transform:translateY(-4px);border-color:var(--ac)}
.shots img{transition:transform .3s}.shots img:hover{transform:scale(1.04)}
[hidden]{display:none!important}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes glow{from{transform:translate(0,0) scale(1)}to{transform:translate(-3%,4%) scale(1.12)}}
@keyframes shine{to{background-position:200% center}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(246,168,44,.55)}70%{box-shadow:0 0 0 16px rgba(246,168,44,0)}100%{box-shadow:0 0 0 0 rgba(246,168,44,0)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (max-width:700px){.hero{grid-template-columns:1fr;text-align:left}.hl{grid-row:1;width:130px}.hr{gap:6px}.hr .btn{padding:10px 12px;font-size:13px;white-space:nowrap}.logo span{white-space:nowrap;font-size:17px}.lg{width:40px;height:40px}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
.panel.on .it:nth-child(1){animation-delay:35ms}
.panel.on .it:nth-child(2){animation-delay:70ms}
.panel.on .it:nth-child(3){animation-delay:105ms}
.panel.on .it:nth-child(4){animation-delay:140ms}
.panel.on .it:nth-child(5){animation-delay:175ms}
.panel.on .it:nth-child(6){animation-delay:210ms}
.panel.on .it:nth-child(7){animation-delay:245ms}
.panel.on .it:nth-child(8){animation-delay:280ms}
.panel.on .it:nth-child(9){animation-delay:315ms}
.panel.on .it:nth-child(10){animation-delay:350ms}
.panel.on .it:nth-child(11){animation-delay:385ms}
.panel.on .it:nth-child(12){animation-delay:420ms}

#am{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}#am.on{display:flex}
#ab{position:relative;background:var(--bg2);color:var(--tx);border:1px solid var(--ln);border-radius:16px;padding:22px;max-width:380px;width:100%;max-height:90vh;overflow:auto;animation:slideUp .3s}
#ax{position:absolute;right:12px;top:8px;background:none;border:0;color:var(--mut);font-size:28px;cursor:pointer}
#ab input:not([type=checkbox]){width:100%;margin:6px 0;padding:11px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit}
#ab .btn{width:100%;margin-top:10px;text-align:center}#ab h3{margin:0 0 4px;font-size:22px}#ab h4{margin:16px 0 6px}
.at{display:flex;gap:6px;margin-bottom:10px}.at button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--ln);background:none;color:var(--tx);font:inherit;font-weight:700;cursor:pointer}.at button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.cons{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--mut);margin-top:6px}.cons input{margin-top:3px}
#aerr{color:#d8362b;font-size:14px;min-height:20px;margin-top:8px}.am1{background:rgba(246,168,44,.18);padding:8px 12px;border-radius:10px;font-size:14px}
.mo{border-bottom:1px solid var(--ln);padding:8px 0}.mut{color:var(--mut)}
</style>
</head>
<body>
<div class="w">
<header><div class="logo" id="logo"></div><div class="hr"><button class="btn o" id="acc">Кіру</button><button class="btn o" id="inst" hidden>Қосымшаны орнату</button><a class="btn" id="hcall" href="#">Қоңырау шалу</a></div></header>

<div class="hero"><div class="hc"><h1 id="h1"></h1><p id="hp"></p><div class="row"><a class="btn pulse" href="#menu">Мәзірді көру</a></div></div><img class="hl" src="/img/logo.png" alt="Big Doner" width="360" height="360"></div>

<div class="facts" id="facts"></div>

<section id="combo">
  <div class="chead"><h2>Тиімді комбо</h2><div class="row" style="flex-wrap:nowrap"><button class="arr" id="cl" aria-label="Алдыңғы">‹</button><button class="arr" id="cr" aria-label="Келесі">›</button></div></div>
  <div class="combos" id="combos"></div>
</section>

<section id="menu">
  <h2>Мәзір</h2>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="panels"></div>
</section>

<section>
  <h2>Клиенттер не дейді</h2>
  <div class="shots" id="shots"></div>
</section>

<section id="contacts">
  <h2>Мекенжай және байланыс</h2>
  <div class="contacts" id="clist"></div>
  <p class="note" id="cnote"></p>
</section>

<div class="cta"><h2>Қарның ашты ма? Тапсырыс бер.</h2><p>Себетке қосып, тапсырысты сайттан жібер. Ыстық тағам есігіңе дейін жетеді.</p></div>

<footer>Big Doner Aktau. Халал өнімдер. Ақтау қаласы.</footer>
</div>
<div id="am"><div id="ab" role="dialog" aria-label="Жеке кабинет"><button id="ax" aria-label="Жабу">×</button><div id="ac"></div></div></div>
<div id="zm"><img alt=""></div>
<div id="bar"><button id="open"><span id="bc"></span><span id="bt"></span></button></div>
<div id="ov"><div id="cart" role="dialog" aria-label="Себет">
<h2>Себет <button id="x" aria-label="Жабу">×</button></h2>
<div id="lines"></div>
<div class="tot"><span>Жиыны</span><span id="tt"></span></div>
<div id="dn"></div>
<label for="mode">Тапсырыс түрі</label>
<select id="mode"><option value="d">Жеткізу</option><option value="p">Өзім барып аламын</option></select>
<div id="adw"><label for="adr">Мекенжай</label><input id="adr" placeholder="Шағынаудан, үй, пәтер"></div>
<label for="nm">Атыңыз</label><input id="nm" placeholder="Атыңыз"><label for="ph">Телефон</label><input id="ph" type="tel" placeholder="+7 7__ ___ __ __">
<label for="br">Қай филиалға жіберу</label><select id="br"></select>
<button class="btn" id="send">Тапсырыс беру</button><div id="st"></div>
<button class="btn o" id="clr" style="width:100%;margin-top:10px">Себетті тазалау</button>
</div></div>
<script src="/client.js"></script>
</body>
</html>
